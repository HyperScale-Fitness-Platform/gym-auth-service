apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-migrate
  namespace: gym-dev
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:16
          env:
            - name: PGHOST
              value: "auth-postgres.<region>.rds.amazonaws.com" 
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: auth-svc-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-svc-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              value: "gym_auth"
          command: ["psql"]
          args: ["-f", "/migrations/schema.sql"]
          volumeMounts:
            - name: migration-sql
              mountPath: /migrations
      volumes:
        - name: migration-sql
          configMap:
            name: auth-db-schema